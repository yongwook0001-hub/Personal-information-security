<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직원 로그인 | 개인정보 처리 관제 시스템</title>
    <link rel="stylesheet" href="../shared/css/base.css">
</head>
<!-- data-role: 이 화면에서 허용할 역할 / data-next: 로그인 성공 시 이동할 페이지 -->
<body data-role="EMPLOYEE" data-next="index.html">
    <div class="auth">
        <section class="auth__aside">
            <div>
                <h1>고객 정보는 사유와 함께 열람합니다</h1>
                <p>모든 열람과 다운로드는 시각, 사유, 접속 위치와 함께 기록되고 총괄책임자가 확인합니다.</p>
            </div>
            <!-- 실제 기록이 어떻게 남는지 보여주는 예시 -->
            <div class="auth__ledger" aria-hidden="true">
                <div><span>09:12</span><span>홍길동 고객 계좌번호 열람</span><span>고객 본인 요청 처리</span></div>
                <div><span>10:47</span><span>유관순 고객 주민번호 열람</span><span>대출 심사 서류 확인</span></div>
                <div><span>23:08</span><span>신사임당 고객 카드번호 열람</span><em>업무시간 외</em></div>
            </div>
        </section>

        <main class="auth__main">
            <form id="loginForm" class="auth__form" novalidate>
                <h2>직원 로그인</h2>
                <p id="loginAlert" class="auth__alert" role="alert" hidden></p>
                <label class="field">
                    <span class="field__label">아이디</span>
                    <input class="input" name="username" autocomplete="username" required>
                </label>
                <label class="field">
                    <span class="field__label">비밀번호</span>
                    <input class="input" name="password" type="password" autocomplete="current-password" required>
                </label>
                <button type="submit" class="btn btn--primary">로그인</button>

                <!-- 목데이터 모드에서만 표시: 시연용 계정 (비밀번호는 모두 password) -->
                <div id="demo" class="demo" hidden
                     data-accounts='[["emp001","이직원 영업팀"],["emp002","박직원 영업팀"],["emp003","최직원 고객팀"],["emp004","정직원 대출팀"],["emp005","한직원 콜센터"]]'>
                    시연용 계정 (비밀번호 password)
                    <div class="demo__list"></div>
                </div>
                <p class="auth__switch">총괄책임자이신가요? <a href="../admin/login.html">관리자 포털로 이동</a></p>
            </form>
        </main>
    </div>

    <!-- 스크립트 순서 중요: 설정 → 목DB → 목서버 → API → UI → 화면 -->
    <script src="../shared/js/config.js"></script>
    <script src="../shared/js/mock-db.js"></script>
    <script src="../shared/js/mock-server.js"></script>
    <script src="../shared/js/api.js"></script>
    <script src="../shared/js/ui.js"></script>
    <script src="../shared/js/login.js"></script>
</body>
</html>
