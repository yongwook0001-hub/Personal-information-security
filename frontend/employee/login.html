<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 개인정보 관리 시스템</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #003366 0%, #0066cc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }
        .login-container h1 {
            text-align: center;
            color: #003366;
            margin-bottom: 2rem;
            font-weight: bold;
        }
        .form-control {
            border-radius: 6px;
            border: 1px solid #ddd;
            padding: 0.75rem;
        }
        .form-control:focus {
            border-color: #003366;
            box-shadow: 0 0 0 0.2rem rgba(0, 51, 102, 0.25);
        }
        .btn-login {
            background-color: #003366;
            border-color: #003366;
            width: 100%;
            padding: 0.75rem;
            font-weight: bold;
            border-radius: 6px;
        }
        .btn-login:hover {
            background-color: #0066cc;
            border-color: #0066cc;
        }
        .alert {
            display: none;
            border-radius: 6px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔒 로그인</h1>
        
        <div id="errorAlert" class="alert alert-danger"></div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">사용자명</label>
                <input type="text" class="form-control" id="username" placeholder="emp001" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" class="form-control" id="password" placeholder="password" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-login">로그인</button>
        </form>
        
        <hr>
        <p style="text-align: center; color: #999; font-size: 0.9rem;">
            테스트 계정: emp001 / password
        </p>
    </div>

    <script src="js/api.js"></script>
    <script>
        // 페이지 로드 시 자동 로그인
        window.addEventListener('load', async function() {
            // 테스트용 자동 로그인 (로컬스토리지에 토큰 설정)
            localStorage.setItem('token', 'test-token-emp001');
            localStorage.setItem('userId', '2');
            localStorage.setItem('username', 'emp001');
            localStorage.setItem('name', '이직원');
            localStorage.setItem('role', 'EMPLOYEE');

            console.log('✅ 자동 로그인 완료');
            window.location.href = 'index.html';
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value || 'emp001';
            const password = document.getElementById('password').value || 'password';
            const errorAlert = document.getElementById('errorAlert');

            try {
                // 테스트용 로컬스토리지 설정
                localStorage.setItem('token', `test-token-${username}`);
                localStorage.setItem('userId', '2');
                localStorage.setItem('username', username);
                localStorage.setItem('name', username === 'emp001' ? '이직원' : username);
                localStorage.setItem('role', 'EMPLOYEE');

                window.location.href = 'index.html';
            } catch (error) {
                errorAlert.textContent = '로그인 실패: 사용자명 또는 비밀번호를 확인하세요.';
                errorAlert.style.display = 'block';
            }
        });
    </script>
</body>
</html>
