<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 - 개인정보 관리 시스템</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a0033 0%, #330066 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }
        .login-container h1 {
            text-align: center;
            color: #330066;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .login-container p {
            text-align: center;
            color: #999;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .form-control {
            border-radius: 6px;
            border: 1px solid #ddd;
            padding: 0.75rem;
        }
        .form-control:focus {
            border-color: #330066;
            box-shadow: 0 0 0 0.2rem rgba(51, 0, 102, 0.25);
        }
        .btn-login {
            background-color: #330066;
            border-color: #330066;
            width: 100%;
            padding: 0.75rem;
            font-weight: bold;
            border-radius: 6px;
        }
        .btn-login:hover {
            background-color: #550099;
            border-color: #550099;
        }
        .alert {
            display: none;
            border-radius: 6px;
            margin-bottom: 1rem;
        }
        .badge-admin {
            display: inline-block;
            background-color: #ff6b6b;
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 관리자 로그인 <span class="badge-admin">ADMIN</span></h1>
        <p>총괄책임자 전용 포탈</p>

        <div id="errorAlert" class="alert alert-danger"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">사용자명</label>
                <input type="text" class="form-control" id="username" placeholder="admin" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" class="form-control" id="password" placeholder="password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-login">로그인</button>
        </form>

        <hr>
        <p style="text-align: center; color: #999; font-size: 0.9rem;">
            테스트 계정: admin / password
        </p>
    </div>

    <script src="../employee/js/api.js"></script>
    <script>
        // 페이지 로드 시 자동 로그인
        window.addEventListener('load', async function() {
            localStorage.setItem('token', 'test-token-admin');
            localStorage.setItem('userId', '1');
            localStorage.setItem('username', 'admin');
            localStorage.setItem('name', '김총괄');
            localStorage.setItem('role', 'ADMIN');

            console.log('✅ 관리자 자동 로그인 완료');
            window.location.href = 'index.html';
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value || 'admin';
            const password = document.getElementById('password').value || 'password';
            const errorAlert = document.getElementById('errorAlert');

            try {
                if (username !== 'admin') {
                    errorAlert.textContent = '관리자 계정만 로그인할 수 있습니다.';
                    errorAlert.style.display = 'block';
                    return;
                }

                localStorage.setItem('token', `test-token-${username}`);
                localStorage.setItem('userId', '1');
                localStorage.setItem('username', username);
                localStorage.setItem('name', '김총괄');
                localStorage.setItem('role', 'ADMIN');

                window.location.href = 'index.html';
            } catch (error) {
                errorAlert.textContent = '로그인 실패: 사용자명 또는 비밀번호를 확인하세요.';
                errorAlert.style.display = 'block';
            }
        });
    </script>
</body>
</html>
