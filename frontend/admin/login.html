<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 | 개인정보 처리 관제 시스템</title>
    <link rel="stylesheet" href="../shared/css/base.css">
</head>
<body data-role="ADMIN" data-next="index.html">
    <div class="auth">
        <section class="auth__aside">
            <div>
                <h1>누가, 언제, 어떤 고객 정보를 봤는지 확인합니다</h1>
                <p>직원의 개인정보 열람·다운로드 기록을 모니터링하고, 이상 징후가 보이면 권한을 해제합니다.</p>
            </div>
            <div class="auth__ledger" aria-hidden="true">
                <div><span>23:05</span><span>박직원, 14건 연속 열람</span><em>업무시간 외</em></div>
                <div><span>14:00</span><span>정직원, 8분간 12건 다운로드</span><em>대량 다운로드</em></div>
                <div><span>15:10</span><span>한직원, 여권번호 열람</span><em>업무 범위 밖</em></div>
            </div>
        </section>

        <main class="auth__main">
            <form id="loginForm" class="auth__form" novalidate>
                <h2>관리자 로그인</h2>
                <p id="loginAlert" class="auth__alert" role="alert" hidden></p>
                <label class="field">
                    <span class="field__label">아이디</span>
                    <input class="input" name="username" autocomplete="username" required>
                </label>
                <label class="field">
                    <span class="field__label">비밀번호</span>
                    <input class="input" name="password" type="password" autocomplete="current-password" required>
                </label>
                <button type="submit" class="btn btn--primary">로그인</button>

                <div id="demo" class="demo" hidden data-accounts='[["admin","김총괄 총괄책임자"]]'>
                    시연용 계정 (비밀번호 password)
                    <div class="demo__list"></div>
                </div>
                <p class="auth__switch">직원이신가요? <a href="../employee/login.html">직원 포털로 이동</a></p>
            </form>
        </main>
    </div>

    <script src="../shared/js/config.js"></script>
    <script src="../shared/js/mock-db.js"></script>
    <script src="../shared/js/mock-server.js"></script>
    <script src="../shared/js/api.js"></script>
    <script src="../shared/js/ui.js"></script>
    <script src="../shared/js/login.js"></script>
</body>
</html>
