<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개인정보 처리 관제 시스템</title>
    <link rel="stylesheet" href="shared/css/base.css">
    <style>
        /* 포털 선택 화면 전용 */
        .portal { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; background: var(--ink); color: #DCE3EA; }
        .portal header { padding: 40px 48px 0; }
        .portal h1 { font-size: clamp(1.8rem, 3.4vw, 2.6rem); font-weight: 700; letter-spacing: -.03em; line-height: 1.25; color: #fff; max-width: 16em; }
        .portal header p { color: #9AA8B8; margin-top: 12px; max-width: 34em; }
        .doors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: #2A3949; margin: 40px 48px; border-radius: var(--radius-lg); overflow: hidden; align-self: start; }
        .door { background: #1A2632; padding: 28px; color: inherit; text-decoration: none; display: flex; flex-direction: column; gap: 10px; }
        .door:hover { background: #213140; }
        .door b { font-size: 1.25rem; color: #fff; }
        .door span { color: #9AA8B8; font-size: .92rem; }
        .door ul { margin: 6px 0 0; padding-left: 18px; color: #B7C3CF; font-size: .88rem; }
        .door em { font-style: normal; margin-top: auto; padding-top: 10px; color: #9DBBE6; font-weight: 600; }
        .portal footer { padding: 0 48px 28px; font-size: .82rem; color: #75839A; }
        @media (max-width: 760px) {
            .doors { grid-template-columns: 1fr; margin: 24px 16px; }
            .portal header, .portal footer { padding-left: 16px; padding-right: 16px; }
        }
    </style>
</head>
<body>
    <div class="portal">
        <header>
            <h1>고객 개인정보를 누가, 언제, 왜 봤는지 남기고 확인합니다</h1>
            <p>직원은 사유를 남기고 고객 정보를 처리하고, 총괄책임자는 그 기록을 모니터링해 이상 징후가 보이면 권한을 해제합니다.</p>
        </header>

        <nav class="doors" aria-label="포털 선택">
            <a class="door" href="employee/login.html">
                <b>직원 포털</b>
                <span>개인정보 처리 담당 직원</span>
                <ul>
                    <li>고객 검색과 개인정보 열람·다운로드</li>
                    <li>파기 요청</li>
                    <li>내 접근 기록 확인</li>
                </ul>
                <em>직원으로 로그인</em>
            </a>
            <a class="door" href="admin/login.html">
                <b>관리자 포털</b>
                <span>관제 총괄 담당자</span>
                <ul>
                    <li>관제 현황과 이상 탐지</li>
                    <li>전체 접근 기록, 고객별 접근 이력</li>
                    <li>권한 해제, 파기 승인, 감사 기록</li>
                </ul>
                <em>관리자로 로그인</em>
            </a>
        </nav>

        <footer id="modeNote"></footer>
    </div>
    <script src="shared/js/config.js"></script>
    <script>
        // 현재 동작 모드 안내 (config.js 의 USE_MOCK)
        document.getElementById('modeNote').textContent = window.APP_CONFIG.USE_MOCK
            ? '현재 목데이터 모드로 동작합니다. 실제 DB 연동은 shared/js/config.js 의 USE_MOCK 을 false 로 바꾸세요.'
            : `실제 API(${window.APP_CONFIG.API_BASE_URL})에 연결합니다.`;
    </script>
</body>
</html>
