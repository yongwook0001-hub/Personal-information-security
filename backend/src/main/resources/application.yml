spring:
  application:
    name: personal-info-system
  datasource:
    url: jdbc:mysql://localhost:3306/personal_info_system?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

jwt:
  secret: mySecretKeyForPersonalInfoSystem2024
  expiration: 86400000

logging:
  level:
    root: INFO
    com.finance.personalinfo: DEBUG
